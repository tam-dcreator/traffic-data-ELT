# Databricks Job definition — V2 Silver Pipeline
# Reference: https://docs.databricks.com/en/dev-tools/bundles/reference.html
#
# Deployment:
#   databricks bundle deploy --target dev
#   databricks bundle run silver_pipeline
#
# All secrets must be configured via Databricks Secrets — never hardcode
# credentials in this file.  Job parameters below reference secret scopes.
#
# This definition targets the test milestone (single sample ZIP).
# Production runs will replace bronze_key with a parameterised loop over all
# archive members.

resources:
  jobs:
    silver_pipeline:
      name: "V2 Silver Pipeline — pNEUMA test sample"
      description: >
        Downloads the pNEUMA Bronze test ZIP from S3, extracts the CSV,
        parses it with the shared PneumaExtractor, and writes normalised
        Silver Parquet to S3.

      # ── Cluster ────────────────────────────────────────────────────────────
      # Use an existing cluster for dev to avoid spin-up cost.
      # For production, switch to new_cluster with a job-cluster policy.
      job_clusters: []

      # ── Task ───────────────────────────────────────────────────────────────
      tasks:
        - task_key: silver_pipeline
          description: "Bronze ZIP → CSV → PneumaExtractor → Spark DataFrame → S3 Silver Parquet"

          notebook_task:
            notebook_path: "v2_cloud/databricks/notebooks/silver_pipeline"
            source: WORKSPACE
            # Explicit, non-account parameters (no /test/ default). Fill at
            # deploy time. EXPECTED_FRAME_ROWS is optional (fixture mode only).
            base_parameters:
              WHEEL_PATH: "${var.wheel_path}"
              S3_BUCKET: "${var.s3_bucket}"
              BRONZE_KEY: "${var.bronze_key}"
              SILVER_OUTPUT_PATH: "${var.silver_output_path}"
              # EXPECTED_FRAME_ROWS: "..."   # set only for fixture runs

          # The versioned wheel is installed inside the notebook from WHEEL_PATH
          # (see scripts/deploy_databricks_artifact.py). No sys.path source sync.

          # ── Retry policy ──────────────────────────────────────────────────
          max_retries: 0
          timeout_seconds: 3600

      # ── Notifications ──────────────────────────────────────────────────────
      # email_notifications:
      #   on_failure:
      #     - your-team@example.com

      # ── Schedule ──────────────────────────────────────────────────────────
      # Uncomment to run on a schedule for production ingestion.
      # schedule:
      #   quartz_cron_expression: "0 0 3 * * ?"
      #   timezone_id: "UTC"
      #   pause_status: PAUSED
