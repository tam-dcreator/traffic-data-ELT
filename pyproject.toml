[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-data-elt"
version = "0.1.0"
description = "Traffic data ELT platform with local and cloud-scale architectures"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.34,<2",
    "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "python-dotenv>=1.0,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
