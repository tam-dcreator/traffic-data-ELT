# Pre-commit hooks executed before Git creates a commit.
# This configuration adds GitGuardian secret scanning at commit time.

repos:
  # GitGuardian ggshield repository.
  - repo: https://github.com/GitGuardian/ggshield

    # Pin the hook version for reproducible development environments.
    rev: v1.53.0

    hooks:
      # Scan staged changes for secrets such as API keys,
      # passwords, tokens, and private keys.
      - id: ggshield

        # Use the Python runtime available in the Dev Container.
        language_version: python3

        # Run only during the pre-commit stage.
        stages: [pre-commit]

  # Ruff linter — enforces the rule set configured in pyproject.toml
  # ([tool.ruff.lint]). Pinned for reproducibility; keep in sync with the
  # ruff version pin in pyproject.toml's dev extras.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6

    hooks:
      # Lint. Runs `ruff check`; only the safe/mechanical fixes are auto-applied
      # so behaviour-sensitive findings still surface for manual review.
      - id: ruff
        args: [--fix]
        stages: [pre-commit]