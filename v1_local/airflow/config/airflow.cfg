# Airflow configuration overrides for V1 local stack.
# Values here complement environment variables set in compose.yaml.
# Environment variables (AIRFLOW__SECTION__KEY) take precedence over this file.

[core]
# DAGs are loaded from the mounted directory only.
load_examples = False
# Generous timeout for DAG file parsing on a resource-constrained local machine.
dagbag_import_timeout = 60
# Keep task instance history manageable on local storage.
max_active_runs_per_dag = 1

[database]
# sql_alchemy_conn is set via AIRFLOW__DATABASE__SQL_ALCHEMY_CONN env var.
# Connection pool sizing for a single-node local deployment.
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10

[logging]
logging_level = INFO
# Avoid unbounded log accumulation.
log_retention_days = 30

[scheduler]
# Reduce scheduler heartbeat frequency for lower CPU usage on local machines.
scheduler_heartbeat_sec = 10
# Number of DAG runs to process per scheduler loop iteration.
max_dagruns_to_create_per_loop = 5
max_dagruns_per_loop_to_schedule = 20

[api]
# Auth backend — use Airflow's built-in auth for local development.
auth_backends = airflow.api.auth.backend.basic_auth
# Use only 1 API worker so your cpu usage in the container is reduced
workers = 1